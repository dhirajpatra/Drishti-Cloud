server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Docker's embedded DNS; the variable below makes nginx start even if the gateway is still booting.
  # On Kubernetes / another platform change this resolver (or point $gw at a normal upstream).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gw http://gateway:8000;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gw;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # operator-notes records API used by the architecture page
  location = /actions {
    proxy_pass $gw;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}

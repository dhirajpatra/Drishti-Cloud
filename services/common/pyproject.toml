[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-common"
version = "1.0.0"
description = "Shared library for every Drishti Cloud Python service"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0",
  "requests",
  "psycopg[binary,pool]>=3.2",
  "neo4j>=5.20",
  "pillow>=10.3",
  "httpx>=0.27",
  "cryptography>=42",
]

[tool.setuptools]
packages = ["drishti"]

# Drishti Cloud - multi-agent, multi-tenant, multi-modal security platform.
#   laptop :  cp .env.example .env && docker compose up -d --build     (works with NO API key: MOCK_MODE=auto)
#   cloud  :  same file. Set BIND_ADDR=0.0.0.0, AUTH_REQUIRED=true, ADMIN_TOKEN, real passwords, drop the `sim`
#             profile and put TLS (Caddy / ALB / nginx) in front of gateway:8000 and frontend:3000.
# Scale any stateless agent:  docker compose up -d --scale spark-multimodal=3
name: drishti

# ---- shared blocks ---------------------------------------------------------------------------
x-env-file: &env-file
  env_file:
    - path: .env           # optional: tuning knobs (thresholds, models, MOCK_MODE ...) reach every service
      required: false

x-infra-env: &infra-env    # wiring that must point at the compose network (overrides .env)
  TZ: ${TZ:-Asia/Kolkata}
  REDIS_URI: redis://redis:6379/0
  DATABASE_URL: postgresql://drishti:${POSTGRES_PASSWORD:-drishti123}@postgres:5432/drishti
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-drishti123}
  GATEWAY_URL: http://gateway:8000

x-agent: &agent
  <<: *env-file
  restart: unless-stopped
  depends_on:
    gateway: { condition: service_healthy }   # gateway creates the schema + seeds before anything consumes
  environment:
    <<: *infra-env

x-py-build: &py-build
  context: ./services
  dockerfile: Dockerfile.python

services:
  # ---- data plane ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.21
    restart: unless-stopped
    ports: ["${BIND_ADDR:-127.0.0.1}:7474:7474", "${BIND_ADDR:-127.0.0.1}:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-drishti123}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-drishti123}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued frames survive restarts; volatile-lru only ever evicts TTL'd keys (frames), never streams
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "volatile-lru"]
    ports: ["${BIND_ADDR:-127.0.0.1}:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: drishti
      POSTGRES_USER: drishti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti123}
    ports: ["${BIND_ADDR:-127.0.0.1}:5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishti -d drishti"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ---- API ----------------------------------------------------------------------------------
  gateway:
    <<: *env-file
    build: { <<: *py-build, args: { SERVICE: gateway } }
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports: ["${GATEWAY_BIND_ADDR:-${BIND_ADDR:-127.0.0.1}}:8000:8000"]   # GATEWAY_BIND_ADDR=0.0.0.0 lets a camera on the LAN call the motion web hook
    environment:
      <<: *infra-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  # ---- agents (stateless; scale with --scale) -----------------------------------------------------
  feed-ingestor:                       # RTSP / MP4 -> gateway (idle when RTSP_FEEDS is empty)
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: feed-ingestor, SYSTEM_PACKAGES: "libglib2.0-0 libgl1" } }
    command: ["python", "-u", "main.py"]
    volumes: ["./feeds:/app/feeds:ro"]
    environment:
      <<: *infra-env
      RTSP_FEEDS: ${RTSP_FEEDS:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-m", "drishti.healthcheck", "feed-ingestor"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  sam3-segmenter:                      # perception: SAM 3.1
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: sam3-segmenter } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "sam3-segmenter"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  ocr-reader:                          # text on monitors / signs / notices
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: ocr-reader } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "ocr-reader"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  spark-multimodal:                    # Muse Spark: images + sensors + text + SOP docs -> decision
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: spark-multimodal } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "spark-multimodal"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  wonder-reasoner:                     # Muse Wonder + Neo4j habits + news
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: wonder-reasoner } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "wonder-reasoner"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  image-alert:                         # annotated visual proof
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: image-alert } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "image-alert"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  news-context:                        # local news -> NewsContext nodes
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: news-context } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "news-context"], interval: 60s, timeout: 5s, retries: 3, start_period: 30s }

  action-agent:                        # persists events/alerts, queues speaker/OLED/ISD1820, notifies
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: action-agent } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "action-agent"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  fridge-inventory-agent:
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: fridge-inventory-agent } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "fridge-inventory-agent"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  grocery-price-agent:
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: grocery-price-agent } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "grocery-price-agent"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  icu-medicine-agent:
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: icu-medicine-agent } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "icu-medicine-agent"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  whatsapp-connector:
    <<: *agent
    build: { <<: *py-build, args: { SERVICE: whatsapp-connector } }
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "whatsapp-connector"], interval: 30s, timeout: 5s, retries: 3, start_period: 20s }

  # ---- demo edge (profile `sim`; .env.example enables it via COMPOSE_PROFILES) --------------------------
  pi-edge-simulator:
    <<: *agent
    profiles: ["sim"]
    build: { <<: *py-build, args: { SERVICE: pi-edge-simulator } }
    environment:
      <<: *infra-env
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    healthcheck: { test: ["CMD", "python", "-m", "drishti.healthcheck", "pi-edge-simulator"], interval: 30s, timeout: 5s, retries: 3, start_period: 30s }

  # ---- dashboard -----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      args: { VITE_API_URL: /api }
    restart: unless-stopped
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:80"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  neo4j_data:
  redis_data:
  pg_data:
